[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "falkordb-codegraph"
version = "0.1.0"
description = "Provenance-first Python codebase investigation backed by FalkorDB"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "falkordb>=1.0,<2",
  "packaging>=23",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-language-pack>=0.11,<0.12",
  "mcp==2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]
embeddings = [
  "detect-secrets>=1.5,<2",
  "huggingface-hub==1.33.0",
  "numpy==2.4.6",
  "onnxruntime==1.23.2",
  "tokenizers==0.23.2",
  "openai>=2,<3",
  "psutil>=6,<8",
  "tiktoken==0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
pythonpath = ["."]
norecursedirs = ["backend/tests/fixtures"]
